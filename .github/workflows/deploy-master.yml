# Live-Deploy für Journal: Push auf master
# 
# Baut die App und lädt sie direkt live auf Firebase hoch.
# Analog zur Preview-Action wird das vitalos Meta-Repo ausgecheckt,
# damit alle Nachbar-Repos (cross-repo imports) vorhanden sind.

name: Live Deploy (Journal master)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vitalos (Meta-Repo, liefert Nachbar-Repos)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/vitalos
          ref: master

      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --recursive

      - name: Submodule-Pfad auflösen (journal-app bevorzugt, journal-dev als Fallback)
        # Gleiche appDir()-Logik wie packages/cross-app-aliases/index.mjs: erster
        # existierender Kandidat gewinnt. Sub-Repos heißen als vitalos-Submodule
        # "*-app", als eigenständiger Checkout "*-dev" — beide Namen sind in
        # Gebrauch, hardcoded auf einen von beiden bricht bei der nächsten
        # Umbenennung wieder.
        run: |
          if [ -d "journal-app" ]; then
            SUBMODULE_PATH="journal-app"
          elif [ -d "journal-dev" ]; then
            SUBMODULE_PATH="journal-dev"
          else
            echo "::error::Weder journal-app noch journal-dev im Checkout gefunden"
            exit 1
          fi
          echo "SUBMODULE_PATH=$SUBMODULE_PATH" >> "$GITHUB_ENV"
          echo "Aufgelöst: $SUBMODULE_PATH"

      - name: Submodule auf den ausgelösten Commit setzen
        run: |
          cd "$SUBMODULE_PATH"
          SHA="${{ github.sha }}"
          git fetch origin "$SHA"
          git checkout "$SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (Workspaces)
        run: npm ci

      - name: Firebase config bereitstellen
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            echo "$FIREBASE_CONFIG" > "$SUBMODULE_PATH/firebase.config.js"
          elif [ ! -f "$SUBMODULE_PATH/firebase.config.js" ]; then
            cp firebase.config.js "$SUBMODULE_PATH/firebase.config.js"
          fi
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}

      - name: Build Journal (Live)
        run: npm run build:cloud --workspace="$SUBMODULE_PATH"

      - name: Deploy Live
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          entryPoint: ${{ env.SUBMODULE_PATH }}
          channelId: live

      - name: Telegram-Benachrichtigung senden
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Journal ist LIVE deployed (master)!

            🔗 Live-URL: https://fitness-aos.web.app
            (oder eine verknüpfte Domain)

            Commit: ${{ github.event.head_commit.message }}
