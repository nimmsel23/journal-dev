# Standalone-Prod Journal: Push auf master deployt live (nur CI).
# Journal selbst ist standalone; deploy:all:build endet mit apps/habits, das
# @fitness-db/@fuel braucht → Nachbarn fitness-dev + fuel-dev (+ exercise-data/coaching-notes)
# und 6pack-dev (miniAppSubmodulePlugin → views/SixPack/workoutDoc.js).
# Kein relax/plan/skills, kein vitalos-Meta.
#
# Auslöser: push auf master und workflow_dispatch (automerge.yml) -> baut und deployt live (nur master).
# Push auf `ci-test/**` -> reiner Build-Test (Nachbarn von dev), KEIN Deploy.

name: Live Deploy (Journal master)

'on':
  workflow_dispatch:
    inputs:
      deploy:
        description: "Live deployen? (nur auf master wirksam; false = nur bauen)"
        type: boolean
        default: true
  push:
    branches:
      - master
      - 'ci-test/**'

concurrency:
  group: live-journal-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEIGHBOR_REF: ${{ github.ref == 'refs/heads/master' && 'master' || 'dev' }}
      DO_DEPLOY: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.deploy) }}
    steps:
      - name: Checkout journal-dev
        uses: actions/checkout@v7
        with:
          path: journal-dev
          # Volle Historie: der Changelog (scripts/vos-changelog) liest bei workflow_dispatch `git log <parent>..HEAD`.
          fetch-depth: 0

      - name: Checkout Nachbarn (${{ env.NEIGHBOR_REF }})
        run: |
          set -euo pipefail
          # fitness-dev@dev: Bulk/vendor-Fix noch nicht auf master (Check dort rot).
          git clone --depth 1 --branch dev "https://github.com/nimmsel23/fitness-dev.git" fitness-dev
          echo "fitness-dev @ $(git -C fitness-dev rev-parse --short HEAD) (dev)"
          git clone --depth 1 --branch "$NEIGHBOR_REF" "https://github.com/nimmsel23/fuel-dev.git" fuel-dev
          echo "fuel-dev @ $(git -C fuel-dev rev-parse --short HEAD)"
          # habits/fitness importiert views/SixPack/* → Resolver mappt auf 6pack-dev Root.
          git clone --depth 1 --branch "$NEIGHBOR_REF" "https://github.com/nimmsel23/6pack-dev.git" 6pack-dev
          echo "6pack-dev @ $(git -C 6pack-dev rev-parse --short HEAD)"
          test -f 6pack-dev/workoutDoc.js

      - name: Checkout fitness KB (SOT)
        uses: actions/checkout@v7
        with:
          repository: nimmsel23/fitness
          ref: main
          path: fitness-kb
          submodules: recursive

      - name: KB in fitness-dev einhängen
        run: |
          set -euo pipefail
          mkdir -p fitness-dev/fitness/catalog
          rm -rf fitness-dev/fitness/catalog/kb
          ln -sfn "$GITHUB_WORKSPACE/fitness-kb" fitness-dev/fitness/catalog/kb
          test -d fitness-dev/fitness/catalog/kb/exercises/6pack
          test -f fitness-dev/fitness/catalog/kb/vendor/free-exercise-db/dist/exercises.json
          echo "KB @ $(git -C fitness-kb rev-parse --short HEAD)"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: journal-dev/pnpm-lock.yaml

      - name: Install (journal-dev, eigener Lockfile)
        working-directory: journal-dev
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Nachbarn (je eigener Lockfile)
        run: |
          set -euo pipefail
          for repo in fitness-dev fuel-dev; do
            echo "::group::$repo"
            if [ -f "$repo/pnpm-lock.yaml" ]; then
              (cd "$repo" && pnpm install --no-frozen-lockfile --ignore-scripts)
            elif [ -f "$repo/package.json" ]; then
              echo "::warning::$repo hat keinen pnpm-lock.yaml — Install ohne Lockfile"
              (cd "$repo" && pnpm install --no-frozen-lockfile --ignore-scripts)
            fi
            echo "::endgroup::"
          done

      - name: Fitness generated.js (exercise-data, ohne plan/6pack)
        working-directory: fitness-dev
        run: pnpm run build:exercise-data && pnpm run build:coaching-notes

      - name: Build Journal
        working-directory: journal-dev
        run: pnpm run deploy:all:build

      - name: Deploy Journal to Firebase Hosting
        if: env.DO_DEPLOY == 'true'
        working-directory: journal-dev
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx firebase-tools@latest deploy --only hosting:journal,hosting:v2,hosting:door,hosting:voice,hosting:game,hosting:tent,hosting:habits \
            --project fitness-aos --non-interactive
