<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f59e0b" />
    <!-- KEIN manuelles <link rel="manifest"> hier — anders als fuel-dev
         nutzt journal-dev vite-plugin-pwa (siehe vite.config.cjs), das
         Manifest + <link rel="manifest" href="/manifest.webmanifest">
         automatisch beim Build injiziert (injectRegister: "auto"). Ein
         zusätzlicher manueller Tag hier würde auf die alte, ungenutzte
         public/manifest.json zeigen und mit dem injizierten Tag kollidieren
         (zwei <link rel="manifest">-Tags, Browser nimmt den ersten). Die
         apple-mobile-web-app-*-Tags injiziert der Plugin NICHT automatisch,
         die bleiben hier zu Recht manuell. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Journal" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Vital-Journal</title>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 20% 0%, rgba(249,115,22,.18), transparent 40%), #0b1018;
        color: #e2e8f0; font-family: Inter, system-ui, sans-serif;
        transition: opacity .35s ease, visibility .35s ease;
      }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash img { border-radius: 22px; box-shadow: 0 0 48px rgba(245,158,11,.25); animation: s-pop .6s ease-out both; }
      #splash .s-name { font-size: 13px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: #fdba74; }
      #splash .s-bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
      #splash .s-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #f59e0b; animation: s-run 1.1s ease-in-out infinite; }
      @keyframes s-pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
      @keyframes s-run { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .s-bar i { animation: none; }
        #splash .s-bar i { width: 100%; }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <div id="splash" role="status" aria-label="Journal lädt">
      <img src="/icons/icon-192.png" width="84" height="84" alt="" />
      <div class="s-name">Vital-Journal</div>
      <div class="s-bar"><i></i></div>
    </div>
    <script>
      // Splash bleibt mind. 600 ms sichtbar, spätestens nach 8 s weg.
      // main.jsx ruft window.__hideSplash() nach dem ersten Auth-Status.
      // Service-Worker-Registrierung + Updates: components/UpdateManager.jsx
      window.__hideSplash = function () {
        var el = document.getElementById('splash')
        if (!el || el.dataset.hiding) return
        el.dataset.hiding = '1'
        setTimeout(function () {
          el.classList.add('hide')
          setTimeout(function () { el.remove() }, 400)
        }, Math.max(0, 600 - performance.now()))
      }
      setTimeout(window.__hideSplash, 8000)
    </script>
  </body>
</html>
