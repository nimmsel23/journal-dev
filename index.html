<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f59e0b" />
    <!-- KEIN manuelles <link rel="manifest"> hier — anders als fuel-dev
         nutzt journal-dev vite-plugin-pwa (siehe vite.config.cjs), das
         Manifest + <link rel="manifest" href="/manifest.webmanifest">
         automatisch beim Build injiziert (injectRegister: "auto"). Ein
         zusätzlicher manueller Tag hier würde auf die alte, ungenutzte
         public/manifest.json zeigen und mit dem injizierten Tag kollidieren
         (zwei <link rel="manifest">-Tags, Browser nimmt den ersten). Die
         apple-mobile-web-app-*-Tags injiziert der Plugin NICHT automatisch,
         die bleiben hier zu Recht manuell. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Journal" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Vital-Journal</title>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          window.__swRegistration = reg
          const notify = () => window.dispatchEvent(new CustomEvent('sw-update-available'))
          if (reg.waiting) notify()
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing
            if (!nw) return
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) notify()
            })
          })
        }).catch(() => {})
        let reloading = false
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return
          reloading = true
          window.location.reload()
        })
      }
    </script>
  </body>
</html>
