# Auto-Promote dev -> master (ersetzt den alten PR-basierten Auto-Merge).
# Ziel: nichts bleibt auf dev liegen. Ablauf:
#   Check auf dev gruen            -> master wird per Fast-Forward auf dev gezogen, Live-Deploy per Dispatch
#   dev hinter master              -> dev wird per Fast-Forward auf master gezogen
#   beide haben eigene Commits     -> roter Lauf (kommt nur nach direktem Push auf master vor): von Hand mit normalem Push zusammenfuehren
# Rot bleibt liegen (kein Promote). Ein Zeitplan (alle 30 Min) faengt haengende Faelle ab. Fast-Forward statt Merge-Commit auf master, weil der Branch-Schutz den Check
# `check` fuer genau diesen Commit verlangt. Pushes mit GITHUB_TOKEN loesen keine Workflows aus -> der Deploy
# wird per workflow_dispatch gestartet. Laeuft aus dem Default-Branch; die Datei muss dort liegen.
# Zusaetzlich: annotated Tag journal-v<package.json version> auf dem Commit, der auf master liegt
# (direkt nach dem Fast-Forward, und beim spaeteren Abgleich, falls der Tag noch fehlt - der erste
# Promote dieser Datei laeuft noch aus dem bisherigen Stand auf master). Existiert der Tag, wird er
# uebersprungen und nicht verschoben. Derselbe GITHUB_TOKEN wie der Branch-Push.

name: Auto-Promote dev -> master (Check (Journal))

on:
  workflow_run:
    workflows: ["Check (Journal)"]
    types: [completed]
  push:
    branches: [master]
  schedule:
    - cron: '17,47 * * * *'   # Sicherungsnetz: haengende Faelle alle 30 Min abgleichen
  workflow_dispatch:

permissions:
  contents: write   # Branches fast-forwarden und refs/tags/journal-v* anlegen
  actions: write
  checks: read

concurrency:
  group: auto-promote-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'dev' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEPLOY_FILE: deploy-master.yml
      CHECK_FILE: check.yml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev
      - name: Abgleichen
        timeout-minutes: 10
        run: |
          set -euo pipefail
          git fetch -q origin master dev
          master=$(git rev-parse origin/master); dev=$(git rev-parse origin/dev)

          # Annotated Tag journal-v<version> auf einem Commit, der auf master liegt.
          # Idempotent: ein vorhandener Tag bleibt, auch wenn er auf einen aelteren Commit zeigt.
          tag_promoted() {
            local sha="$1" ver tag existing peeled
            ver=$(git show "${sha}:package.json" | sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            if [ -z "$ver" ]; then
              echo "::error::keine version in package.json auf ${sha}."
              return 1
            fi
            if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::package.json version '${ver}' auf ${sha} ist kein MAJOR.MINOR.PATCH -> kein Tag."
              return 1
            fi
            tag="journal-v${ver}"
            existing=$(git ls-remote origin "refs/tags/${tag}")
            if [ -n "$existing" ]; then
              # Annotated Tags: die Ref selbst ist das Tag-Objekt; ^{} ist der Commit.
              peeled=$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{ print $1; exit }')
              if [ -z "$peeled" ]; then
                peeled=$(printf '%s\n' "$existing" | awk '{ print $1; exit }')
              fi
              if [ -n "$peeled" ] && [ "$peeled" != "$sha" ]; then
                echo "Tag ${tag} existiert bereits (auf ${peeled}, dieser Commit ist ${sha}) -> uebersprungen, nicht verschoben."
              else
                echo "Tag ${tag} existiert bereits -> uebersprungen."
              fi
              return 0
            fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$tag" "$sha" -m "journal ${ver}"
            git push origin "refs/tags/${tag}"
            echo "Tag ${tag} auf ${sha} gesetzt."
          }

          if [ "$master" = "$dev" ]; then
            echo "dev == master, nichts zu tun."
            tag_promoted "$master"
            exit 0
          fi

          if git merge-base --is-ancestor "$dev" "$master"; then
            echo "dev ist hinter master -> dev per Fast-Forward nachziehen."
            git push origin "${master}:refs/heads/dev"
            tag_promoted "$master"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$master" "$dev"; then
            echo "::error::dev und master haben eigene Commits (jemand hat direkt auf master gepusht). Von Hand mit einem normalen Push zusammenfuehren: git merge origin/master auf dev, pushen -> Check -> dieser Workflow zieht master nach."
            exit 1
          fi

          # Nur ein Check, den ein normaler Push ausgeloest hat, erfuellt den Branch-Schutz; per Dispatch gestartete Checks nicht.
          res=$(gh api "repos/$REPO/commits/$dev/check-runs" --jq '[.check_runs[]|select(.name=="check")]|first|if .==null then "none" elif .status!="completed" then "pending" else .conclusion end')
          case "$res" in
            success)
              echo "Check gruen auf $dev -> master per Fast-Forward, Live-Deploy per Dispatch."
              git push origin "${dev}:refs/heads/master"
              gh workflow run "$DEPLOY_FILE" -R "$REPO" --ref master
              tag_promoted "$dev"
              ;;
            none|pending) echo "Check fuer $dev laeuft noch/fehlt -> naechster Lauf (workflow_run oder Zeitplan) uebernimmt." ;;
            *) echo "Check auf $dev ist '$res' -> bleibt auf dev liegen (rot)." ;;
          esac
