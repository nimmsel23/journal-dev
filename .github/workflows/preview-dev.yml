# Standalone Journal build: no VitalOS checkout or submodules.

name: Preview (Journal dev)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.cjs'
      - 'index.html'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/preview-dev.yml'
  pull_request:
    branches: [vitalos, master, dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.cjs'
      - 'index.html'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/preview-dev.yml'

jobs:
  preview:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Journal
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Journal
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build Journal
        run: pnpm run build:firebase

      - name: Deploy Preview Channel
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          entryPoint: .
          target: journal
          channelId: ${{ github.event_name != 'pull_request' && 'dev' || '' }}
          expires: 24h

      - name: Telegram-Link senden
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Preview für Journal (${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'dev' }}) gebaut!

            🔗 ${{ steps.firebase_deploy.outputs.details_url }}
            ⏱️ Gültig 24h.

            Commit: ${{ github.event.pull_request.title || github.event.head_commit.message }}

