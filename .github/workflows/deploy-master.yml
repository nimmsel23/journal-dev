# Standalone Journal build: no VitalOS checkout or submodules.

name: Live Deploy (Journal master)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.cjs'
      - 'index.html'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-master.yml'

jobs:
  deploy_live:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Journal
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Journal
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build Journal (Live)
        run: pnpm run build:cloud

      - name: Deploy Live
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          entryPoint: .
          target: journal
          channelId: live

      - name: Telegram-Benachrichtigung senden
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Journal ist LIVE deployed (master)!

            🔗 Live-URL: https://fitness-aos.web.app
            (oder eine verknüpfte Domain)

            Commit: ${{ github.event.head_commit.message }}

